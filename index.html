<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eef2f5">
    <title>mlgm · 个人源</title>
    <meta name="description" content="mlgm 的个人源，收录我常用的工具。">
    <meta property="og:title" content="mlgm · 个人源">
    <meta property="og:description" content="个人源 · 收录我常用的工具">
    <meta property="og:image" content="https://mlgm66.github.io/icon.png">
    <meta property="og:url" content="https://mlgm66.github.io/">
    <meta property="og:type" content="website">
    <style>
        :root {
            --ink: #18212b;
            --muted: #7d8995;
            --line: #e2e7eb;
            --blue: #6d9eb2;
            --card: rgba(255, 255, 255, .82);
        }

        * { box-sizing: border-box; }
        html { min-height: 100%; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 28px 16px;
            color: var(--ink);
            background: #eef2f5;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        a, button { -webkit-tap-highlight-color: transparent; -webkit-appearance: none; }
        a { color: inherit; text-decoration: none; }
        button, input { font: inherit; }
        .page { width: min(100%, 430px); }
        .card {
            padding: 36px 28px 25px;
            border: 1px solid rgba(255,255,255,.9);
            border-radius: 24px;
            background: var(--card);
            box-shadow: 0 22px 60px rgba(64, 82, 96, .12);
            backdrop-filter: blur(14px);
        }
        .profile { text-align: center; }
        .avatar {
            width: 88px;
            height: 88px;
            margin: 0 auto 16px;
            border: 4px solid #fff;
            border-radius: 24px;
            object-fit: cover;
            box-shadow: 0 10px 24px rgba(64, 82, 96, .16);
        }
        h1 { margin: 0; font-size: 28px; letter-spacing: -.04em; }
        .bio { margin: 8px 0 28px; color: var(--muted); font-size: 14px; }
        .label { display: block; margin: 0 0 8px; color: var(--muted); font-size: 12px; text-align: left; }
        .repo-row { display: flex; gap: 8px; }
        .repo-input {
            min-width: 0;
            flex: 1;
            height: 44px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            color: #52616d;
            background: rgba(248,250,251,.9);
            outline: none;
            font-size: 13px;
        }
        .repo-input:focus { border-color: var(--blue); }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 15px;
            border: 1px solid var(--line);
            border-radius: 10px;
            color: #52616d;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: border-color .2s ease, transform .2s ease;
        }
        .button:hover, .button:focus-visible { border-color: var(--blue); transform: translateY(-1px); }
        .button-primary { color: #fff; border-color: var(--blue); background: var(--blue); }
        .installers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
        .installer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 10px 4px 8px;
            border: 1px solid transparent;
            border-radius: 11px;
            color: #667681;
            font-size: 11px;
            transition: background .2s ease, border-color .2s ease;
        }
        .installer:hover, .installer:focus-visible { border-color: var(--line); background: #fff; }
        .installer img { width: 27px; height: 27px; object-fit: contain; border: 1px solid #dfe5e9; border-radius: 8px; }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            padding: 9px 13px;
            border-radius: 99px;
            color: #fff;
            background: #364650;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 10px);
            transition: opacity .2s ease, transform .2s ease;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }
        @media (max-width: 390px) {
            .card { padding: 30px 18px 21px; }
            .repo-row { display: grid; grid-template-columns: 1fr auto; }
            .repo-input { grid-column: 1 / -1; width: 100%; }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="card">
            <div class="profile">
                <img class="avatar" src="icon.png" alt="mlgm 的头像">
                <h1>mlgm</h1>
                <p class="bio">个人源 · 收录我常用的工具</p>
            </div>

            <label class="label" for="repo-url">源地址</label>
            <div class="repo-row">
                <input class="repo-input" id="repo-url" type="text" value="https://mlgm66.github.io/" readonly>
                <button class="button button-primary" id="copy-repo" type="button">复制</button>
            </div>

            <div class="installers" aria-label="添加到包管理器">
                <a class="installer" href="sileo://source/https://mlgm66.github.io/"><img src="icon/sileo.png" alt="">Sileo</a>
                <a class="installer" href="zbra://sources/add/https://mlgm66.github.io/"><img src="icon/zebra.png" alt="">Zebra</a>
                <a class="installer" href="cydia://url/https://cydia.saurik.com/api/share#?source=https://mlgm66.github.io/"><img src="icon/cydia.png" alt="">Cydia</a>
                <a class="installer" href="irisin://repository/add?url=https%3A%2F%2Fmlgm66.github.io%2F"><img src="icon/irisin.png" alt="">Irisin</a>
            </div>
        </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite">源地址已复制</div>
    <script>
        const copyButton = document.getElementById('copy-repo');
        const repoInput = document.getElementById('repo-url');
        const toast = document.getElementById('toast');
        let toastTimer;

        copyButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(repoInput.value);
            } catch (error) {
                repoInput.select();
                document.execCommand('copy');
                repoInput.setSelectionRange(0, 0);
            }
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
        });
    </script>
</body>
</html>
